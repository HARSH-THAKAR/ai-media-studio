# Copy this file to config/settings.toml and select locally installed models.

config_version = 1
debug = false

# Relative paths anywhere in this file resolve against the project directory
# when this is the project's own config/settings.toml, and against this file's
# own directory otherwise. Absolute paths are always used as given.
[paths]
assets_dir = "assets"
output_dir = "output"
temp_dir = "temp"
ffmpeg_executable = "ffmpeg"

[ollama]
base_url = "http://127.0.0.1:11434"
model = "REPLACE_WITH_LOCAL_OLLAMA_MODEL"
timeout_seconds = 60

[comfyui]
base_url = "http://127.0.0.1:8188"
workflow_path = "config/comfyui_workflow.json"
# The provider discovers the positive prompt and Save Image nodes automatically.
timeout_seconds = 120
poll_interval_seconds = 1.0
max_retries = 2
retry_delay_seconds = 1.0

[kokoro]
voice = "REPLACE_WITH_LOCAL_KOKORO_VOICE"
speed = 1.0
language_code = "a"
sample_rate = 24000
# Silence appended after each scene so speech does not butt against a cut.
scene_tail_padding_seconds = 0.2
# model_name is optional metadata for the generated artifact.

[video]
width = 1080
height = 1920
frames_per_second = 30
render_timeout_seconds = 300
transition_duration_seconds = 0.5
# A still image reads as a frozen frame beside narration, and language models
# usually ask for no camera motion. Scenes that ask for none are given one
# anyway, alternating so consecutive scenes do not drift the same way. Set
# false to honour the storyboard exactly.
animate_still_scenes = true
# How far a zoom or pan travels, as a fraction. 0.2 zooms to 1.2x over a scene.
camera_motion_strength = 0.2

[logging]
level = "INFO"
console_enabled = true
file_enabled = true
directory = "logs"
filename = "ai_media_studio.log"
max_bytes = 5000000
backup_count = 3

[subtitles]
# Subtitles follow the narration word by word, using timings measured while the
# speech is synthesized. This is the longest caption shown at once; sentences
# are divided into cues of roughly equal length so none is left holding a
# single word.
max_characters_per_cue = 32

# Reserved for generated-asset caching, which is not implemented yet. These
# values are validated on load but nothing reads them.
[cache]
enabled = true
directory = "cache"
max_size_mb = 1024

[music]
directory = "music"
volume = 0.15
fade_duration_seconds = 1.0
ducking_ratio = 6.0

# Reserved for temporary-artifact cleanup, which is not implemented yet.
[temp]
max_age_hours = 24

[gpu]
# Device used by models running inside this process, which today means Kokoro:
# "auto" picks CUDA when it is available, "cpu" and "cuda" force the choice.
# Set "cpu" to keep narration off the graphics card while ComfyUI is using it.
# ComfyUI and FFmpeg are separate processes and choose their own devices.
device = "auto"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-media-studio"
version = "0.1.0"
description = "AI Media Studio"
requires-python = ">=3.12"

dependencies = [
]

[project.scripts]
ai-media-studio = "backend.cli:main"

[tool.setuptools]
packages = ["backend"]

[tool.setuptools.package-data]
backend = ["**/*.json", "**/*.toml"]
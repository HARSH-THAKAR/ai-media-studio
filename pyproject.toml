[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-media-studio"
version = "0.1.0"
description = "AI Media Studio"
requires-python = ">=3.12"

# Local narration synthesis. Every other provider talks to an external
# process over HTTP or the command line, so it needs no Python package:
# Ollama and ComfyUI are reached through urllib, FFmpeg through subprocess.
dependencies = [
    "kokoro>=0.9.4",
    "soundfile>=0.13",
]

[project.scripts]
ai-media-studio = "backend.cli:main"

[tool.setuptools.packages.find]
include = ["backend*"]
